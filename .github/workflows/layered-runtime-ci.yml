name: Layered Runtime Verification

on:
  push:
    branches: [main]
    paths:
      - 'AGENTS.md'
      - 'docs/architecture-delta-principle.md'
      - 'docs/skill-runtime-architecture.md'
      - 'docs/skill-token-economics.md'
      - 'skills/**'
      - 'scripts/simulate-workflow-counterfactual.py'
      - 'scripts/compile-live-skill-eval.py'
      - 'scripts/compile-live-skill-eval.py'
      - 'scripts/bump-version.sh'
      - 'tests/counterfactual/**'
      - 'tests/codex/**'
      - 'tests/writing-skills/**'
      - 'tests/systematic-debugging/**'
      - 'tests/data-collection-pipeline/**'
      - 'tests/eval-skills/**'
      - '.version-bump.json'
      - 'package.json'
      - '.codex-plugin/plugin.json'
      - '.claude-plugin/plugin.json'
      - '.cursor-plugin/plugin.json'
      - '.devin-plugin/plugin.json'
      - '.kimi-plugin/plugin.json'
      - 'gemini-extension.json'
      - '.github/workflows/layered-runtime-ci.yml'
  pull_request:
    paths:
      - 'AGENTS.md'
      - 'docs/architecture-delta-principle.md'
      - 'docs/skill-runtime-architecture.md'
      - 'docs/skill-token-economics.md'
      - 'skills/**'
      - 'scripts/simulate-workflow-counterfactual.py'
      - 'scripts/bump-version.sh'
      - 'tests/counterfactual/**'
      - 'tests/codex/**'
      - 'tests/writing-skills/**'
      - 'tests/systematic-debugging/**'
      - 'tests/data-collection-pipeline/**'
      - 'tests/eval-skills/**'
      - '.version-bump.json'
      - 'package.json'
      - '.codex-plugin/plugin.json'
      - '.claude-plugin/plugin.json'
      - '.cursor-plugin/plugin.json'
      - '.devin-plugin/plugin.json'
      - '.kimi-plugin/plugin.json'
      - 'gemini-extension.json'
      - '.github/workflows/layered-runtime-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version manifest consistency
        run: bash scripts/bump-version.sh --check
      - name: Version tooling without jq
        run: bash tests/codex/test-bump-version-no-jq.sh
      - name: Progressive skill loading
        run: bash tests/codex/test-progressive-skill-loading.sh
      - name: Architecture routing and delta
        run: bash tests/writing-skills/test-architecture-routing.sh
      - name: Layered skill and token economics
        run: bash tests/writing-skills/test-token-economics.sh
      - name: Systematic debugging operator
        run: bash tests/systematic-debugging/test-find-polluter.sh
      - name: Data collection pipeline
        run: bash tests/data-collection-pipeline/test_skill_contract.sh
      - name: Crawlee lazy bootstrap fresh install
        env:
          CRAWLEE_BOOTSTRAP_TEST_RUNTIME: ${{ runner.temp }}/livingware-crawlee-bootstrap-cache
        run: bash tests/data-collection-pipeline/test_crawlee_bootstrap_fresh_install.sh
      - name: Crawlee no-venv target fallback
        run: bash tests/data-collection-pipeline/test_crawlee_bootstrap_target_fallback.sh
      - name: Crawlee offline and no-network bootstrap
        env:
          CRAWLEE_BOOTSTRAP_TEST_RUNTIME: ${{ runner.temp }}/livingware-crawlee-bootstrap-cache
        run: bash tests/data-collection-pipeline/test_crawlee_bootstrap_offline.sh
      - name: Livingware eval skill contracts
        run: python3 tests/eval-skills/test_eval_skills_contract.py
      - name: Counterfactual evaluator
        run: |
          python3 tests/counterfactual/test-workflow-counterfactual.py > /tmp/counterfactual-test.log 2>&1 || {
            cat /tmp/counterfactual-test.log
            exit 1
          }
          cat /tmp/counterfactual-test.log
      - name: Upload counterfactual diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: counterfactual-test-log
          path: /tmp/counterfactual-test.log
      - name: Codex marketplace manifest
        run: bash tests/codex/test-marketplace-manifest.sh
      - name: Codex package contract
        run: bash tests/codex/test-package-codex-plugin.sh
